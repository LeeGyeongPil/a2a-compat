# Default suite only: mock agents, no network or keys. Official-SDK and process-level tests run locally
# (npm run test:all). Reproduce this workflow locally with: npm run ci:local
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Show versions
        run: node -v && npm -v
      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test (default suite)
        run: npm test
